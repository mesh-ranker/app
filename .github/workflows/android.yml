name: Android

# Сборка APK: JVM-тесты ядра и подписанная release-сборка.
# При push в main создаётся GitHub Release с APK и автоматически растущей версией.

on:
  push:
    branches: [main, 'arena/**', 'test-maxim-work']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Один активный запуск на ветку/тег: предыдущий отменяется, чтобы не жечь минуты.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_PACKAGES: 'platforms;android-35 build-tools;35.0.0'
  BUILD_TOOLS_VERSION: '35.0.0'
  # Человекочитаемое представление списка пакетов для ключа кеша SDK.
  ANDROID_SDK_CACHE_KEY: android-35-build-tools-35.0.0

jobs:
  build:
    name: APK (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Версия сборки
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          VERSION_CODE="${RUN_NUMBER}"
          IS_TEST="0"
          case "${GITHUB_REF}" in
            refs/tags/v*)
              VERSION_NAME="${GITHUB_REF_NAME#v}"
              RELEASE_TAG="${GITHUB_REF_NAME}"
              ;;
            refs/heads/test-maxim-work)
              VERSION_NAME="1.0.${VERSION_CODE}-test"
              RELEASE_TAG="test-v1.0.${VERSION_CODE}"
              IS_TEST="1"
              ;;
            *)
              VERSION_NAME="1.0.${VERSION_CODE}"
              RELEASE_TAG="v${VERSION_NAME}"
              ;;
          esac
          {
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "VERSION_NAME=${VERSION_NAME}"
          } >> "$GITHUB_ENV"
          {
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "is_test=${IS_TEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Сборка ${VERSION_NAME} (versionCode ${VERSION_CODE}), тег ${RELEASE_TAG}, test=${IS_TEST}"

      - name: Подготовить release-подпись
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кеш Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-35
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_SDK_CACHE_KEY }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ env.ANDROID_SDK_CACHE_KEY }}-

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - name: Gradle (кеш и wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Тесты и release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --warning-mode all testDebugUnitTest assembleRelease

      - name: Проверка подписи APK
        run: |
          set -eu
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Подготовить APK для релиза
        run: cp app/build/outputs/apk/release/app-release.apk "mesh-ranker-${VERSION_NAME}.apk"

      - name: GitHub Release
        # Только push в main, test-maxim-work или на тег v*; PR и workflow_dispatch релиз не создают.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-maxim-work' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: MESH Ranker ${{ steps.version.outputs.version_name }}
          body: |
            Автоматическая подписанная release-сборка.

            - versionCode: `${{ steps.version.outputs.version_code }}`
            - commit: `${{ github.sha }}`
          files: mesh-ranker-${{ steps.version.outputs.version_name }}.apk
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version.outputs.is_test == '1' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
