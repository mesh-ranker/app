name: Android

# Сборка APK: JVM-тесты ядра и debug-сборка.
# При push в main создаётся GitHub Release с APK и автоматически растущей версией.

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Версия сборки
        id: version
        run: |
          VERSION_CODE=$(date +%s)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="1.0.${VERSION_CODE}"
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Сборка $VERSION_NAME (versionCode $VERSION_CODE), тег $RELEASE_TAG"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Gradle (кеш и wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Права на gradlew
        run: chmod +x ./gradlew

      - name: JVM-тесты ядра (без эмулятора)
        working-directory: .
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Debug APK
        working-directory: .
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Подготовить APK для релиза
        run: cp app/build/outputs/apk/debug/app-debug.apk "mesh-ranker-${VERSION_NAME}.apk"

      - name: GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: MESH Ranker ${{ steps.version.outputs.version_name }}
          body: |
            Автоматическая debug-сборка.

            - versionCode: `${{ steps.version.outputs.version_code }}`
            - commit: `${{ github.sha }}`
          files: mesh-ranker-${{ steps.version.outputs.version_name }}.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
