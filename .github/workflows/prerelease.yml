name: Linux and Android pre-release

on:
  push:
    branches: [test-branch-lexus, linux-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish pre-release APK
    if: github.ref == 'refs/heads/test-branch-lexus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        run: |
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-test" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --warning-mode all assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "mesh-ranker-${VERSION_NAME}.apk"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-branch-lexus-${{ github.run_number }}
          name: MESH Ranker ${{ env.VERSION_NAME }}
          prerelease: true
          generate_release_notes: true
          files: mesh-ranker-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Build native Linux packages
    if: github.ref == 'refs/heads/linux-app' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        run: |
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm libfuse2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build .deb and AppImage
        run: ./gradlew --no-daemon --warning-mode all :linuxApp:packageReleaseDeb :linuxApp:packageReleaseAppImage

      - name: Prepare Linux artifacts
        run: |
          cp linuxApp/build/compose/binaries/main-release/deb/*.deb "mesh-ranker-${VERSION_NAME}-amd64.deb"
          cp linuxApp/build/compose/binaries/main-release/app/*.AppImage "mesh-ranker-${VERSION_NAME}-x86_64.AppImage"

      - name: Publish Linux GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-app-${{ github.run_number }}
          name: MESH Ranker ${{ env.VERSION_NAME }}
          prerelease: true
          generate_release_notes: true
          files: |
            mesh-ranker-${{ env.VERSION_NAME }}-amd64.deb
            mesh-ranker-${{ env.VERSION_NAME }}-x86_64.AppImage
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
