<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МЭШ — оценки и рейтинг класса</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="login-root" class="d-none"></div>

  <div id="app" class="d-none">
    <nav class="navbar navbar-expand-lg border-bottom bg-body-tertiary sticky-top">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-bar-chart-line"></i> МЭШ: оценки и рейтинг</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navCollapse">
          <ul class="navbar-nav me-auto" id="nav"></ul>
          <div class="d-flex align-items-center gap-2">
            <span id="student-select-wrap"></span>
            <span id="token-status" class="small text-secondary"></span>
            <button class="btn btn-sm btn-outline-secondary" id="btn-profile" title="Профиль" aria-label="Профиль"><i class="bi bi-person"></i></button>
            <button class="btn btn-sm btn-outline-secondary" id="btn-settings" title="Настройки" aria-label="Настройки"><i class="bi bi-gear"></i></button>
            <button class="btn btn-sm btn-outline-secondary" id="btn-refresh" title="Обновить"><i class="bi bi-arrow-clockwise"></i></button>
            <button class="btn btn-sm btn-outline-secondary" id="btn-theme" title="Тема"><i class="bi bi-sun"></i></button>
            <button class="btn btn-sm btn-outline-secondary" id="btn-login" title="Войти заново"><i class="bi bi-key"></i></button>
            <button class="btn btn-sm btn-outline-danger" id="btn-logout" title="Выйти"><i class="bi bi-box-arrow-right"></i></button>
          </div>
        </div>
      </div>
    </nav>
    <main class="container-fluid py-3" id="view-host"></main>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toasts"></div>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <!-- Ядро МЭШ -->
  <script src="../core/lib/util.js"></script>
  <script src="../core/lib/stats.js"></script>
  <script src="../core/lib/format.js"></script>
  <script src="../core/lib/table.js"></script>
  <script src="../core/mesh-core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/ranking.js"></script>
  <script src="js/views/subjects.js"></script>
  <script src="js/views/marks.js"></script>
  <script src="js/views/homeworks.js"></script>
  <script src="js/views/schedule.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/settings.js"></script>
</body>
</html>
